  note: |-
    Every push to main publishes :latest and sha-<commit>. No version tags and no deploy hook: srv-media
    pins the digest in its one-shot job's compose, and moving that pin is its own change.
  gates:
    quality:
      class: heavy
      timeout: 30
      steps:
      - name: Point at the runner's toolchain
        run: |
          {
            echo "PATH=/home/runner-ci/.cargo/bin:/usr/local/bin:/usr/bin:/bin"
            echo "RUSTUP_HOME=/home/runner-ci/.rustup"
          } >> "$GITHUB_ENV"
      - checkout
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
  image_timeout: 45
hermes-image:
  family: image
  note: |-
    test applies the patches to upstream at the Dockerfile's version and runs their suites, so a patch that
    no longer applies fails loudly. image builds and checks the image on pull requests too, and on main
    pushes it as <upstream version>-<sha7>. homelab pins that tag as hermes_image; nothing deploys from here.
  gates:
    test:
      class: medium
      timeout: 30
      steps:
      - checkout
      - name: Patch upstream and test
        run: bash .forgejo/test-patches.sh
  image_timeout: 45
  image_on_pull_request: true
