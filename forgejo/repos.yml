curatarr:
  family: image
  note: |-
    verify lints and tests. image builds the standalone bundle on the runner and packages it, on pull
    requests too, so its sharp gate judges a change before it merges; main pushes :latest and deploys.
  gates:
    verify:
      class: heavy
      timeout: 20
      steps:
      - checkout
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
  image_timeout: 30
  image_on_pull_request: true
  deploy_url: https://apps.webhook.lepaux.com/deploy
dinle:
  family: images
  note: |-
    app and worker each test against the app's dev stack. A release builds both images, each on its
    own hardware, and deploys after both: the app's start requeues failures, and the old worker must
    not spend the attempts on what the release fixed. A push with no release builds nothing, since
    srv-compute restarts on a new worker `latest` (a hand dispatch on main is that too).
    A newer push cancels an older run, and this family has no rebuild to heal it: a release whose
    images were cancelled ships with the next release, or by a hand dispatch while main is still on
    its tag. Forgejo 15's queue can stall on a run with a skipped job (forgejo#14576), so none is set.
  gates:
    app:
      class: heavy
      timeout: 60
      steps:
      - checkout
      - name: Lint and test the app and the release config, against the dev stack
        run: .forgejo/gate.sh app
    worker:
      class: heavy
      timeout: 60
      steps:
      - checkout
      - name: Format, lint and test the worker, against the dev stack
        run: .forgejo/gate.sh worker
  images:
    app:
      arch: arm64
      timeout: 60
    worker:
      arch: x64
      timeout: 60
  deploy_url: https://apps.webhook.lepaux.com/deploy
kaneo-mcp:
  family: tag-release
  note: |-
    A push checks the crate. A tag vX.Y.Z also cross-compiles the binary for both Macs and publishes
    it as this forge's release, since no fleet host is a Mac and none is to run CI (homelab HL-739).
    What only macOS shows reaches a Mac first: the install's version probe is what refuses a bad build.
  gates:
    checks:
      class: heavy
      timeout: 30
      steps:
      - name: Point at the runner's toolchain
        run: |
          {
            echo "PATH=/home/runner-ci/.cargo/bin:/usr/local/bin:/usr/bin:/bin"
            echo "RUSTUP_HOME=/home/runner-ci/.rustup"
          } >> "$GITHUB_ENV"
      - checkout
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked
  release_script: .forgejo/release-darwin.sh
  release_timeout: 60
hermes-image:
  family: image
  note: |-
    test applies the patches to upstream at the Dockerfile's version and runs their suites, so a patch that
    no longer applies fails loudly. image builds and checks the image on pull requests too, and on main
    pushes it as <upstream version>-<sha7>. homelab pins that tag as hermes_image; nothing deploys from here.
  gates:
    test:
      class: medium
      timeout: 30
      steps:
      - checkout
      - name: Patch upstream and test
        run: bash .forgejo/test-patches.sh
  image_timeout: 45
  image_on_pull_request: true
katha:
  family: service
  gates:
    quality:
      class: heavy
      timeout: 30
      steps:
      - name: Point at the runner's toolchain
        run: |
          {
            echo "PATH=/home/runner-ci/.cargo/bin:/usr/local/bin:/usr/bin:/bin"
            echo "RUSTUP_HOME=/home/runner-ci/.rustup"
          } >> "$GITHUB_ENV"
      - checkout
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
      # The image is built only after a release is cut, so an include_str! the Dockerfile does not
      # COPY would publish a version with no image (KAT-2).
      - name: Docker builder context compiles
        run: scripts/check-docker-context.sh
    advisories:
      class: medium
      timeout: 15
      steps:
      - name: Point at the runner's toolchain
        run: |
          {
            echo "PATH=/home/runner-ci/.cargo/bin:/usr/local/bin:/usr/bin:/bin"
            echo "RUSTUP_HOME=/home/runner-ci/.rustup"
          } >> "$GITHUB_ENV"
      - checkout
      - name: Advisories
        run: cargo deny check advisories
    # A broken docs change fails here on a pull request and holds a release back; publish-site below
    # puts main's docs live.
    # Heavy, not medium: katha's medium-class peak reads 10 GB in docs/ci-capacity.md with no job label,
    # and the docs build is the likeliest source, which a medium job's 2G MemoryMax would not hold.
    docs:
      class: heavy
      timeout: 15
      steps:
      - checkout
      - name: Install
        run: cd docs && npm ci --no-audit --no-fund
      - name: Build
        run: cd docs && npm run build
  image_timeout: 45
  # LAN only: srv-media's webhook binds this address, and every arm64 medium client reaches it.
  deploy_url: http://192.168.1.20:3005/deploy
  # katha.pages.lepaux.com, the forge's GitHub Pages replacement (homelab HL-675, HL-736). Heavy as the
  # docs gate is.
  site:
    class: heavy
    timeout: 15
    steps:
    - checkout
    - full-history
    - name: Install
      run: cd docs && npm ci --no-audit --no-fund
    - name: Build
      run: |
        cd docs && npm run build
        git rev-parse HEAD > .vitepress/dist/revision.txt
    dir: docs/.vitepress/dist
    # A 200 alone could be the previous release, so the site proves the commit it serves.
    served:
      name: Served
      env:
        SHA: ${{ github.sha }}
      run: |
        set -euo pipefail
        served="$(curl -fsS --retry 3 https://katha.pages.lepaux.com/revision.txt)"
        [ "$served" = "$SHA" ] || {
          echo "::error::katha.pages.lepaux.com serves commit $served, not this run's $SHA"; exit 1; }
        echo "serving $served"

