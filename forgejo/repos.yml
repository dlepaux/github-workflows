homelab-schema:
  family: package
  gates:
    quality:
      class: heavy
      timeout: 20
      steps:
      - checkout
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      # Vitest runs the TypeScript source through its own module interop, so an import the
      # built package cannot satisfy (js-yaml 5 dropped its default export) passes every
      # test above. Load dist/ the way consumers do, and parse a file through it.
      - name: Smoke-test the built package
        run: |
          smoke=$(mktemp --suffix=.yaml)
          trap 'rm -f "$smoke"' EXIT
          printf 'services: {}\n' > "$smoke"
          node --input-type=module -e "
            import { validateFile } from './dist/index.js';
            const r = validateFile(process.argv[1]);
            const msgs = (r.errors ?? []).map((e) => e.message).join('; ');
            if (r.success || msgs.includes('YAML parse error')) { console.error(msgs); process.exit(1); }
            console.log('dist loads and parses YAML');
          " "$smoke"
  release_install: true
  release_env:
    NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
