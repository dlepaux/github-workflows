name: Docker Build & Push (Buildx)

on:
  workflow_call:
    inputs:
      image-name:
        description: Full image name including registry
        type: string
        required: true
      version:
        description: Version tag without v prefix (empty = no version tag)
        type: string
        default: ''
      platforms:
        description: Target platforms (comma-separated)
        type: string
        default: linux/amd64,linux/arm64
      build-args:
        description: Docker build args as multiline KEY=VALUE (one per line)
        type: string
        default: ''
      runner:
        description: Runner to use (default self-hosted ARM64, override with ubuntu-latest for heavy amd64 builds)
        type: string
        # Was '["self-hosted", "homelab"]' until 2026-08-13. NO runner in the fleet has
        # ever advertised a `homelab` label — runner-rootless registers
        # [self-hosted, Linux, ARM64|X64, rootless, instance-N, host-<name>] — so a caller
        # that omitted `runner:` got a job that queued until it timed out rather than one
        # that failed fast. It stayed invisible because every live caller passes the input
        # explicitly; the only repos still on the default were the gordon-* set, archived
        # the same day. Kept arch-agnostic on purpose: adding ARM64 here would silently
        # exclude srv-compute for the amd64 callers that do override.
        default: '["self-hosted", "rootless"]'
      cache-image:
        description: >-
          Registry ref for a buildx layer cache (empty = no cache, unchanged behaviour).
          E.g. ghcr.io/owner/img:buildcache. Rootless-safe (network write, no host
          bind-mount EACCES) and host-independent — any runner reads the same cache.
        type: string
        default: ''
      dockerfile:
        description: >-
          Path to the Dockerfile (relative to the repo-root build context). Default
          ./Dockerfile (unchanged behaviour). Set e.g. docker/server.Dockerfile to build a
          non-root-Dockerfile image (a repo that publishes more than one image).
        type: string
        default: ./Dockerfile

jobs:
  docker:
    runs-on: ${{ fromJSON(inputs.runner) }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Build from the release tag, not github.sha — semantic-release bumps
          # version files in a chore(release) commit AFTER the triggering SHA, so
          # github.sha bakes the PREVIOUS version into the binary even though the
          # image is tagged with the new one. refs/tags/v<version> (pushed by the
          # release job this build `needs:`) makes the compiled-in version match
          # the image tag. Empty version → '' → default checkout (github.sha).
          ref: ${{ inputs.version != '' && format('refs/tags/v{0}', inputs.version) || '' }}

      # QEMU is only needed for cross-architecture emulation (multi-arch builds,
      # or single-arch builds where target != runner arch). Skip on native
      # single-arch builds — required on rootless runners where binfmt
      # registration needs CAP_SYS_ADMIN and would fail with
      # "cannot mount binfmt_misc filesystem".
      - name: Set up QEMU
        if: |
          !(inputs.platforms == 'linux/arm64' && runner.arch == 'ARM64') &&
          !(inputs.platforms == 'linux/amd64' && runner.arch == 'X64')
        uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ inputs.image-name }}
          tags: |
            type=raw,value=latest
            type=sha
            ${{ inputs.version != '' && format('type=raw,value={0}', inputs.version) || '' }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          # Default ./Dockerfile (unchanged for existing callers); overridable so a repo can
          # publish more than one image from distinct Dockerfiles.
          file: ${{ inputs.dockerfile }}
          push: true
          # Always re-resolve FROM tags against the registry. Self-hosted
          # runners persist BuildKit's local image store, so without this a
          # rebuild reuses a months-old cached base (e.g. nginx:alpine) and
          # silently ships its CVEs even after a forced rebuild.
          pull: true
          platforms: ${{ inputs.platforms }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ inputs.build-args }}
          # Opt-in registry layer cache (cache-image set). type=registry, not type=local:
          # rootless dockerd writes a host bind-mount as a subuid-mapped root → EACCES,
          # so a local cache dir fails; a registry cache writes over the network and is
          # host-independent. Empty cache-image → empty args → no cache (default).
          cache-from: ${{ inputs.cache-image != '' && format('type=registry,ref={0}', inputs.cache-image) || '' }}
          cache-to: ${{ inputs.cache-image != '' && format('type=registry,ref={0},mode=max', inputs.cache-image) || '' }}
