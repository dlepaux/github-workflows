name: Docker Build & Push (Buildx)

on:
  workflow_call:
    inputs:
      image-name:
        description: Full image name including registry
        type: string
        required: true
      version:
        description: Version tag without v prefix (empty = no version tag)
        type: string
        default: ''
      platforms:
        description: Target platforms (comma-separated)
        type: string
        default: linux/amd64,linux/arm64
      build-args:
        description: Docker build args as multiline KEY=VALUE (one per line)
        type: string
        default: ''
      runner:
        description: Runner to use (default self-hosted ARM64, override with ubuntu-latest for heavy amd64 builds)
        type: string
        # Was '["self-hosted", "homelab"]' until 2026-08-13. NO runner in the fleet has
        # ever advertised a `homelab` label — runner-rootless registers
        # [self-hosted, Linux, ARM64|X64, rootless, instance-N, host-<name>] — so a caller
        # that omitted `runner:` got a job that queued until it timed out rather than one
        # that failed fast. It stayed invisible because every live caller passes the input
        # explicitly; the only repos still on the default were the gordon-* set, archived
        # the same day. Kept arch-agnostic on purpose: adding ARM64 here would silently
        # exclude srv-compute for the amd64 callers that do override.
        # ci-heavy since 2026-09-04 (jit-fleet-scheduling): an image build is a heavy
        # job by definition — it gets the heavy per-host slot and its unit ceiling.
        default: '["self-hosted", "rootless", "ci-heavy"]'
      cache-image:
        description: >-
          Registry ref for a buildx layer cache (empty = no cache, unchanged behaviour).
          E.g. ghcr.io/owner/img:buildcache. Rootless-safe (network write, no host
          bind-mount EACCES) and host-independent — any runner reads the same cache.
        type: string
        default: ''
      dockerfile:
        description: >-
          Path to the Dockerfile (relative to the repo-root build context). Default
          ./Dockerfile (unchanged behaviour). Set e.g. docker/server.Dockerfile to build a
          non-root-Dockerfile image (a repo that publishes more than one image).
        type: string
        default: ./Dockerfile
      test-script:
        description: >-
          Path of a script in the calling repo that runs the image before it is published
          (empty = no test, unchanged behaviour). The image is pushed by digest, with no tag,
          and the script is run with bash on the runner with that reference in IMAGE
          (name@sha256:...). Only if it exits 0 are `latest`, the sha and the version tag
          pointed at that digest: an image that fails is in the registry and nothing pulls it.
          For a single platform built on a runner of that platform, since the script runs it.
        type: string
        default: ''

jobs:
  docker:
    runs-on: ${{ fromJSON(inputs.runner) }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Build from the release tag, not github.sha — semantic-release bumps
          # version files in a chore(release) commit AFTER the triggering SHA, so
          # github.sha bakes the PREVIOUS version into the binary even though the
          # image is tagged with the new one. refs/tags/v<version> (pushed by the
          # release job this build `needs:`) makes the compiled-in version match
          # the image tag. Empty version → '' → default checkout (github.sha).
          ref: ${{ inputs.version != '' && format('refs/tags/v{0}', inputs.version) || '' }}

      # QEMU is only needed when a target platform differs from the runner's arch.
      # setup-qemu-action registers binfmt, which needs CAP_SYS_ADMIN — a rootless
      # runner fails it with "cannot mount binfmt_misc filesystem". The x64 fleet
      # runners therefore register qemu-aarch64 themselves (homelab runner-rootless,
      # HL-153): when the kernel already holds the interpreter, the action is skipped.
      # A cross-compiling Dockerfile only emulates its runtime stage's RUN steps; the
      # compile runs natively on $BUILDPLATFORM.
      - name: Decide whether QEMU must be registered
        id: qemu
        env:
          PLATFORMS: ${{ inputs.platforms }}
          BINFMT_DIR: /proc/sys/fs/binfmt_misc   # overridden by tests/qemu-decision
        run: |
          case "$RUNNER_ARCH" in
            X64)   foreign=linux/arm64; interp=qemu-aarch64 ;;
            ARM64) foreign=linux/amd64; interp=qemu-x86_64 ;;
            *)     echo "setup=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          if ! printf '%s' "$PLATFORMS" | tr ',' '\n' | grep -qx "$foreign"; then
            echo "setup=false" >> "$GITHUB_OUTPUT"   # native build, nothing to emulate
          elif head -n1 "$BINFMT_DIR/$interp" 2>/dev/null | grep -qx enabled; then
            echo "setup=false" >> "$GITHUB_OUTPUT"   # host-registered interpreter
            echo "using the host's $interp binfmt for $foreign"
          else
            echo "setup=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        if: steps.qemu.outputs.setup == 'true'
        uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ inputs.image-name }}
          tags: |
            type=raw,value=latest
            type=sha
            ${{ inputs.version != '' && format('type=raw,value={0}', inputs.version) || '' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          # Default ./Dockerfile (unchanged for existing callers); overridable so a repo can
          # publish more than one image from distinct Dockerfiles.
          file: ${{ inputs.dockerfile }}
          # With a test-script nothing is tagged here: the image goes up by digest (the
          # `outputs` line, as docker-build-push-native.yml pushes each arch) and the last
          # step tags it. Without one, `push` and `tags` are what they always were and
          # `outputs` is empty.
          push: ${{ inputs.test-script == '' }}
          outputs: ${{ inputs.test-script != '' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', inputs.image-name) || '' }}
          # Always re-resolve FROM tags against the registry. Self-hosted
          # runners persist BuildKit's local image store, so without this a
          # rebuild reuses a months-old cached base (e.g. nginx:alpine) and
          # silently ships its CVEs even after a forced rebuild.
          pull: true
          platforms: ${{ inputs.platforms }}
          tags: ${{ inputs.test-script == '' && steps.meta.outputs.tags || '' }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ inputs.build-args }}
          # Opt-in registry layer cache (cache-image set). type=registry, not type=local:
          # rootless dockerd writes a host bind-mount as a subuid-mapped root → EACCES,
          # so a local cache dir fails; a registry cache writes over the network and is
          # host-independent. Empty cache-image → empty args → no cache (default).
          cache-from: ${{ inputs.cache-image != '' && format('type=registry,ref={0}', inputs.cache-image) || '' }}
          cache-to: ${{ inputs.cache-image != '' && format('type=registry,ref={0},mode=max', inputs.cache-image) || '' }}

      # The caller's test of the image it just built, on this runner's docker. A build that
      # passes its unit tests can still ship an image that cannot do its job (dinle,
      # 2026-10-02: the worker's unpinned compose could start no engine).
      - name: Test the image before it is tagged
        if: inputs.test-script != ''
        timeout-minutes: 15
        env:
          IMAGE: ${{ inputs.image-name }}@${{ steps.build.outputs.digest }}
          TEST_SCRIPT: ${{ inputs.test-script }}
        run: bash "$TEST_SCRIPT"

      # By digest, so what is tagged is the image that was tested and not a second build
      # of it. Tested by tests/tag-tested-image/run.sh against a registry of its own.
      - name: Tag the tested image
        if: inputs.test-script != ''
        env:
          IMAGE: ${{ inputs.image-name }}@${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          tags=()
          while IFS= read -r tag; do
            [ -z "$tag" ] || tags+=(-t "$tag")
          done <<< "$TAGS"
          docker buildx imagetools create "${tags[@]}" "$IMAGE"
