name: Docker Build & Push

on:
  workflow_call:
    inputs:
      image-name:
        description: Full image name including registry
        type: string
        required: true
      version:
        description: Version tag without v prefix (empty = no version tag)
        type: string
        default: ''
      build-args:
        description: Docker build args as multiline KEY=VALUE (one per line)
        type: string
        default: ''
      inject-npm-token:
        description: Add NODE_AUTH_TOKEN build arg for GitHub Packages auth
        type: boolean
        default: false
      runner:
        description: >-
          JSON runs-on list. Default is the historical hardcoded value (tokenless = the
          fleet's ARM64 tier). An arm64 image built on x64 passes
          '["self-hosted","rootless","X64","arch-any","ci-heavy"]' plus `platform` (HL-153).
        type: string
        default: '["self-hosted", "rootless", "ci-heavy"]'
      platform:
        description: >-
          Target platform passed to `docker build --platform` (e.g. linux/arm64). Empty =
          the runner's own arch (unchanged behaviour). Set it whenever `runner` can land on
          a different arch, or an x64 runner silently ships an amd64 image. A foreign
          target's RUN steps execute through the host's qemu binfmt (homelab
          runner-rootless registers it on the x64 runners), so the Dockerfile should build
          on $BUILDPLATFORM and leave only its runtime stage to emulation.
        type: string
        default: ''

jobs:
  docker:
    runs-on: ${{ fromJSON(inputs.runner) }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          # Build from the release tag, not github.sha — semantic-release bumps
          # version files in a chore(release) commit AFTER the triggering SHA, so
          # github.sha bakes the PREVIOUS version into the binary even though the
          # image is tagged with the new one. refs/tags/v<version> (pushed by the
          # release job this build `needs:`) makes the compiled-in version match
          # the image tag. Empty version → '' → default checkout (github.sha).
          ref: ${{ inputs.version != '' && format('refs/tags/v{0}', inputs.version) || '' }}

      - name: Isolate Docker credentials
        run: |
          DOCKER_CONFIG="$(mktemp -d)"
          echo "DOCKER_CONFIG=$DOCKER_CONFIG" >> "$GITHUB_ENV"

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Docker image
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TAGS="-t ${{ inputs.image-name }}:latest -t ${{ inputs.image-name }}:sha-${SHORT_SHA}"
          if [ -n "${{ inputs.version }}" ]; then
            TAGS="${TAGS} -t ${{ inputs.image-name }}:${{ inputs.version }}"
          fi
          BUILD_ARGS=""
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            BUILD_ARGS="${BUILD_ARGS} --build-arg ${line}"
          done <<< "${{ inputs.build-args }}"
          if [ "${{ inputs.inject-npm-token }}" = "true" ]; then
            BUILD_ARGS="${BUILD_ARGS} --build-arg NODE_AUTH_TOKEN=${NPM_TOKEN:-${GITHUB_TOKEN}}"
          fi
          PLATFORM=""
          if [ -n "${{ inputs.platform }}" ]; then
            PLATFORM="--platform ${{ inputs.platform }}"
          fi
          DOCKER_BUILDKIT=1 docker build ${PLATFORM} ${BUILD_ARGS} ${TAGS} .

      - name: Push Docker image
        run: docker push --all-tags ${{ inputs.image-name }}

      - name: Cleanup credentials
        if: always()
        run: |
          docker logout ghcr.io || true
          rm -rf "$DOCKER_CONFIG"
