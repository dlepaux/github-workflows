name: Docker Build & Push (Native Multi-Arch)

# Multi-arch Docker builds using native runners — no QEMU emulation.
# Each platform builds on its matching runner, then manifests are merged.
# Requires self-hosted runners with labels: X64, ARM64.

on:
  workflow_call:
    inputs:
      image-name:
        description: Full image name including registry
        type: string
        required: true
      version:
        description: Version tag without v prefix (empty = no version tag)
        type: string
        default: ''
      build-args:
        description: Docker build args as multiline KEY=VALUE (one per line)
        type: string
        default: ''

jobs:
  # NO `wake` JOB, deliberately — removed 2026-08-21.
  #
  # This used to call wake-compute.yml and gate the whole matrix on it, because
  # srv-compute was the fleet's ONLY x86_64 runner and it sleeps. That made every
  # amd64 leg hard-depend on a WoL relay answering, which CLAUDE.md forbids outright,
  # and on 2026-08-20 it cost a build: the relay was powered off, `wake` failed with
  # curl exit 7, and BOTH arch legs were skipped — including arm64, which needs
  # nothing from that box.
  #
  # srv-swiss is now a second x86_64 runner and it is always on, so x64 capacity no
  # longer depends on waking anything. github-triage still auto-wakes srv-compute when
  # it routes an x64 job there (TRIAGE_X64_HOSTS + TRIAGE_WOL_HOSTS), so the fast path
  # is preserved without this workflow gating on it — exactly how the-beret-game's x64
  # legs have always worked.
  #
  # Not `continue-on-error` (unsupported on a reusable-workflow call) and not
  # `if: always()` (that leaves every run RED when the relay is down, even though the
  # image built fine — which is how you train someone to ignore CI).
  build:
    strategy:
      # fail-fast: FALSE, deliberately. With `true`, an amd64 failure cancels the
      # in-flight arm64 leg, so the run tells you nothing about whether arm64 would
      # have built — and on a two-arch matrix that is exactly the question you need
      # answered when one arch's HOST is the problem rather than the code.
      # `merge` still needs both, so a partial matrix cannot publish a single-arch
      # manifest: this changes what you learn from a failure, not what gets shipped.
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: '["self-hosted", "rootless", "X64"]'
          - platform: linux/arm64
            runner: '["self-hosted", "rootless", "ARM64"]'
    runs-on: ${{ fromJSON(matrix.runner) }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Build from the release tag, not github.sha — semantic-release bumps
          # version files in a chore(release) commit AFTER the triggering SHA, so
          # github.sha bakes the PREVIOUS version into the binary even though the
          # image is tagged with the new one. refs/tags/v<version> (pushed by the
          # release job this build `needs:`) makes the compiled-in version match
          # the image tag. Empty version → '' → default checkout (github.sha).
          ref: ${{ inputs.version != '' && format('refs/tags/v{0}', inputs.version) || '' }}

      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ inputs.image-name }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # Self-hosted runners persist BuildKit's local image store; re-resolve
          # FROM tags against the registry so a rebuild can't reuse a stale
          # cached base and silently ship its CVEs.
          pull: true
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ inputs.build-args }}
          # Supply-chain attestations: SBOM (what's inside) + provenance
          # (how it was built). Adds ~30s per arch build; carried into the
          # final multi-arch manifest because each per-arch image is pushed
          # with its own attestation manifest, and `imagetools create` in
          # the merge step preserves them.
          sbom: true
          provenance: mode=max
          outputs: type=image,name=${{ inputs.image-name }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          # Self-hosted runners persist /tmp across jobs; wipe stale digest
          # files from prior runs so upload-artifact only picks up this
          # run's digest. Without this, the merge step tries to create a
          # manifest referencing digests that GHCR has already garbage-
          # collected, failing with "not found".
          rm -rf /tmp/digests
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v6
        with:
          name: digests-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: [self-hosted, rootless]
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - name: Clean workspace
        # Same rationale as the build job's Export digest step — prevent a
        # previous run's digest files from slipping into the manifest.
        run: rm -rf /tmp/digests

      - name: Download digests
        uses: actions/download-artifact@v7
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ inputs.image-name }}
          tags: |
            type=raw,value=latest
            type=sha
            ${{ inputs.version != '' && format('type=raw,value={0}', inputs.version) || '' }}

      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ inputs.image-name }}@sha256:%s ' *)
