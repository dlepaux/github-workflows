name: Deploy

on:
  workflow_call:
    inputs:
      webhook-url:
        description: Deploy webhook URL
        type: string
        default: https://webhook.lepaux.com/deploy
      environment:
        description: GitHub environment (triggers protection rules when set)
        type: string
        default: ''
      retries:
        description: Number of retry attempts
        type: number
        default: 3
      retry-delay:
        description: Delay between retries in seconds
        type: number
        default: 30
    secrets:
      webhook-key:
        required: false

jobs:
  deploy:
    # Self-hosted by policy — every job in this workflow library runs on the
    # homelab fleet, not on GitHub-hosted runners. The webhook itself is
    # publicly reachable, so this is operator preference (locality + no
    # GitHub minutes), not a network requirement. Any homelab runner will
    # do — the job is just a curl with retries.
    runs-on: [self-hosted, rootless]
    environment: ${{ inputs.environment || null }}
    steps:
      - name: Resolve deploy credentials
        id: creds
        run: |
          # Resolve webhook key: prefer secrets input, fall back to runner env
          KEY="${{ secrets.webhook-key }}"
          if [ -z "$KEY" ]; then
            KEY="${WEBHOOK_DEPLOY_KEY:-}"
          fi
          if [ -z "$KEY" ]; then
            echo "::error::No webhook key available — set secrets.webhook-key or WEBHOOK_DEPLOY_KEY on the runner"
            exit 1
          fi
          echo "::add-mask::${KEY}"
          echo "key=${KEY}" >> "$GITHUB_OUTPUT"

          # Resolve webhook URL: prefer non-default input, fall back to runner env, else hardcoded default
          # HOMELAB_WEBHOOK_URL stores the base (no /deploy path) — append it here.
          URL="${{ inputs.webhook-url }}"
          if [ "$URL" = "https://webhook.lepaux.com/deploy" ] && [ -n "${HOMELAB_WEBHOOK_URL:-}" ]; then
            URL="${HOMELAB_WEBHOOK_URL}/deploy"
          fi
          echo "url=${URL}" >> "$GITHUB_OUTPUT"

      - name: Trigger deploy webhook
        run: |
          for attempt in $(seq 1 ${{ inputs.retries }}); do
            echo "Deploy attempt ${attempt}/${{ inputs.retries }}..."
            RESPONSE=$(mktemp)
            HTTP_CODE=$(curl -s -o "$RESPONSE" -w "%{http_code}" \
              --max-time 180 -X POST \
              -H "Authorization: Bearer ${{ steps.creds.outputs.key }}" \
              ${{ steps.creds.outputs.url }})

            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              echo "Deploy successful (HTTP $HTTP_CODE)"
              cat "$RESPONSE"
              rm -f "$RESPONSE"
              exit 0
            fi

            echo "Deploy failed (HTTP $HTTP_CODE):"
            cat "$RESPONSE"
            rm -f "$RESPONSE"

            if [ "$attempt" -lt "${{ inputs.retries }}" ]; then
              echo "Retrying in ${{ inputs.retry-delay }}s..."
              sleep ${{ inputs.retry-delay }}
            fi
          done
          echo "Deploy failed after ${{ inputs.retries }} attempts"
          exit 1
