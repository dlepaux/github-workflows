name: Deploy

on:
  workflow_call:
    inputs:
      webhook-url:
        description: Deploy webhook URL
        type: string
        default: https://webhook.lepaux.com/deploy
      environment:
        description: GitHub environment (triggers protection rules when set)
        type: string
        default: ''
      retries:
        description: Number of retry attempts
        type: number
        default: 3
      retry-delay:
        description: Delay between retries in seconds
        type: number
        default: 30
      runner:
        description: Runner to use (JSON array). Default self-hosted; override
          with '["ubuntu-latest"]' for GitHub-hosted repos. The webhook URL is
          public, so GitHub-hosted runners reach it fine.
        type: string
        default: '["self-hosted", "rootless"]'
    secrets:
      webhook-key:
        required: false

jobs:
  deploy:
    # Self-hosted by default (operator preference: locality + no GitHub
    # minutes); the webhook is publicly reachable so this is not a network
    # requirement. Repos on GitHub-hosted runners pass runner:
    # '["ubuntu-latest"]' — they fall back to the public webhook-url default
    # (HOMELAB_WEBHOOK_URL is only set on self-hosted runners).
    runs-on: ${{ fromJSON(inputs.runner) }}
    environment: ${{ inputs.environment || null }}
    steps:
      - name: Resolve deploy credentials
        id: creds
        run: |
          # Resolve webhook key: prefer secrets input, fall back to runner env
          KEY="${{ secrets.webhook-key }}"
          if [ -z "$KEY" ]; then
            KEY="${WEBHOOK_DEPLOY_KEY:-}"
          fi
          if [ -z "$KEY" ]; then
            echo "::error::No webhook key available — set secrets.webhook-key or WEBHOOK_DEPLOY_KEY on the runner"
            exit 1
          fi
          echo "::add-mask::${KEY}"
          echo "key=${KEY}" >> "$GITHUB_OUTPUT"

          # Resolve webhook URL: prefer non-default input, fall back to runner env, else hardcoded default
          # HOMELAB_WEBHOOK_URL stores the base (no /deploy path) — append it here.
          URL="${{ inputs.webhook-url }}"
          if [ "$URL" = "https://webhook.lepaux.com/deploy" ] && [ -n "${HOMELAB_WEBHOOK_URL:-}" ]; then
            URL="${HOMELAB_WEBHOOK_URL}/deploy"
          fi
          echo "url=${URL}" >> "$GITHUB_OUTPUT"

      - name: Trigger deploy webhook
        # NOT `bash -e` (the Actions default): this step's retry loop must own its
        # own exit code. Under `-e`, `HTTP_CODE=$(curl …)` aborts the WHOLE script
        # the instant curl returns non-zero on a transport error (connect-refused/
        # DNS/timeout/TLS) — so the loop died on attempt 1 and the 3× retry never
        # ran (the very resilience this step exists to provide). `pipefail` + `-u`
        # keep the safety that matters; the loop handles curl's exit itself.
        shell: bash
        run: |
          set -uo pipefail
          RETRIES=${{ inputs.retries }}
          DELAY=${{ inputs.retry-delay }}
          URL="${{ steps.creds.outputs.url }}"

          # Translate curl's transport exit codes into a human label so the next
          # outage is diagnosable at a glance instead of a bare "exit code N".
          curl_reason() {
            case "$1" in
              0)  echo "curl ok (HTTP-level failure, not transport)" ;;
              6)  echo "could not resolve host (DNS)" ;;
              7)  echo "failed to connect (host down / refused / firewalled)" ;;
              28) echo "operation timed out (--connect-timeout/--max-time)" ;;
              35) echo "TLS handshake failed" ;;
              52) echo "empty reply from server" ;;
              56) echo "failure receiving network data (connection reset)" ;;
              *)  echo "curl error (see https://curl.se/libcurl/c/libcurl-errors.html)" ;;
            esac
          }

          for attempt in $(seq 1 "$RETRIES"); do
            echo "Deploy attempt ${attempt}/${RETRIES} → POST ${URL}"
            RESPONSE=$(mktemp)
            # `|| CURL_EXIT=$?` keeps the non-zero transport status without `-e`
            # tearing the loop down; --connect-timeout fails a black-hole host
            # fast instead of burning the full --max-time read budget per try.
            CURL_EXIT=0
            HTTP_CODE=$(curl -s -o "$RESPONSE" -w "%{http_code}" \
              --connect-timeout 10 --max-time 180 -X POST \
              -H "Authorization: Bearer ${{ steps.creds.outputs.key }}" \
              "$URL") || CURL_EXIT=$?

            if [ "$CURL_EXIT" -eq 0 ] && [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              echo "Deploy successful (HTTP $HTTP_CODE)"
              cat "$RESPONSE"
              rm -f "$RESPONSE"
              exit 0
            fi

            # Legible failure: transport-vs-HTTP, the curl exit code + its meaning,
            # the HTTP status (000 when the request never completed), and the body.
            if [ "$CURL_EXIT" -ne 0 ]; then
              echo "::warning::Deploy attempt ${attempt} TRANSPORT failure: curl exit ${CURL_EXIT} ($(curl_reason "$CURL_EXIT")); HTTP_CODE=${HTTP_CODE}"
            else
              echo "::warning::Deploy attempt ${attempt} HTTP failure: status ${HTTP_CODE}"
            fi
            echo "--- response body ---"
            cat "$RESPONSE"
            echo ""
            echo "---------------------"
            rm -f "$RESPONSE"

            if [ "$attempt" -lt "$RETRIES" ]; then
              echo "Retrying in ${DELAY}s..."
              sleep "$DELAY"
            fi
          done

          echo "::error::Deploy failed after ${RETRIES} attempts to ${URL} (last: curl exit ${CURL_EXIT:-?} / HTTP ${HTTP_CODE:-?}). If transport (curl 6/7/28), the webhook host was unreachable — this is an infra/homelab outage, not a code regression; re-run once the host is back."
          exit 1
