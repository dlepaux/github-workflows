name: Rust Service CI

on:
  workflow_call:
    inputs:
      binary_name: { type: string, required: true }
      service_port: { type: number, required: true }
      has_openapi: { type: boolean, default: false }
      has_asyncapi: { type: boolean, default: false }
      coverage_floor: { type: number, default: 70 }
      deploy_webhook: { type: boolean, default: true }
    secrets:
      HOMELAB_WEBHOOK_URL: { required: false }
      WEBHOOK_DEPLOY_KEY: { required: false }

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

jobs:
  smoke:
    runs-on: [self-hosted, Linux, ARM64, homelab]
    steps:
      - run: echo "iter3 — permissions only"
