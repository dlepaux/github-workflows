name: Rust Service CI

# CI shape for Gordon Rust services (post 2026-05-15 ci-perf-overhaul):
#
# - Self-hosted runner on srv-core (Pi5, ARM64). Persistent
#   /var/cache/gordon-ci/<repo>/target/ + shared /var/cache/gordon-ci/cargo/
#   are owned by the homelab role (homelab/roles/github-runner). No
#   actions/cache calls — local SSD is the cache. CARGO_HOME +
#   CARGO_TARGET_DIR come from runner.env.
# - build-and-gate: single job — grep lints, fmt, build, clippy, deny,
#   optional OpenAPI drift, release binary upload. target/ stays warm
#   in-process via the persistent CARGO_TARGET_DIR.
# - test-coverage: separate job (instrumented profile is target-
#   incompatible). Uses its own persistent
#   /var/cache/gordon-ci/<repo>/target-llvm-cov/. Runs in parallel with
#   build-and-gate.
# - asyncapi-drift: optional job, gated on `inputs.has_asyncapi`.
# - trivy: filesystem scan, runs in parallel.
# - release: semantic-release on push to main; gates docker.
# - docker: prebuilt binary from build-and-gate artifact → distroless
#   image → trivy image scan → homelab-webhook deploy trigger.
#
# Caller pins at a tag: uses: dlepaux/github-workflows/.github/workflows/rust-service.yml@v1.0.0

on:
  workflow_call:
    inputs:
      binary_name:
        description: Rust binary name (e.g. gordon-manager)
        type: string
        required: true
      service_port:
        description: Service HTTP port — passed as SERVICE_PORT Docker build-arg and EXPOSE
        type: number
        required: true
      has_openapi:
        description: Gate the OpenAPI drift check step in build-and-gate
        type: boolean
        default: false
      has_asyncapi:
        description: Gate the asyncapi-drift job
        type: boolean
        default: false
      needs_nats:
        description: >-
          Provision a JetStream NATS broker in the test-coverage job.
          Required by repos whose integration tests call
          gordon_test_db::test_nats() — a panic-loud helper that expects a
          broker at GORDON_TEST_NATS_URL (default nats://localhost:4223).
          Mirrors `make test-up`'s nats-test container. Default off:
          gordon-executor and gordon-manager do not enable the
          gordon-test-db `nats` feature and need no broker.
        type: boolean
        default: false
      coverage_floor:
        description: Workspace line coverage gate (percent, integer)
        type: number
        default: 70
      deploy_webhook:
        description: Trigger the homelab-webhook deploy step after docker push
        type: boolean
        default: true
    # NOTE on host pinning: dropped the `runner_host` input from v1.x —
    # mixing literal and ${{ }} expression in `runs-on: [...]` fails GHA
    # workflow_call validation with startup_failure. The supported shape
    # is either a plain list (used here) or `${{ fromJSON(inputs.json) }}`
    # (heavier caller surface). All jobs run on `[self-hosted, Linux,
    # ARM64, rootless]` — floats across srv-core + srv-apps. Per-host
    # pinning returns in a future major when the triage daemon (Story 09)
    # makes the decision and the reusable accepts a JSON-encoded list.
    secrets:
      HOMELAB_WEBHOOK_URL:
        required: false
      WEBHOOK_DEPLOY_KEY:
        required: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

# Serialise per-ref. Different refs (branch PRs vs main) run in parallel;
# within a single ref, queue rather than overlap — the persistent target/
# is per-repo, not per-ref, and concurrent builds would contend on cargo's
# advisory locks.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Compile + lint + drift gates that share warm target/. One job, one
  # checkout, one target/ pass. Persistent CARGO_TARGET_DIR (runner.env)
  # keeps incremental compile state across runs — cargo's fingerprint
  # tracking handles staleness.
  build-and-gate:
    runs-on: [self-hosted, Linux, ARM64, rootless]
    env:
      PATH: /home/runner-ci/.cargo/bin:/usr/local/bin:/usr/bin:/bin
      RUSTUP_HOME: /home/runner-ci/.rustup
      # CARGO_HOME + CARGO_TARGET_DIR inherited from runner.env (homelab role).
    steps:
      - uses: actions/checkout@v6

      # ─────────────────────────────────────────────────────────────────────
      # Gate — no per-test NATS testcontainers. Integration tests must use the
      # shared test_nats() broker (gordon-test-db) with a delete+recreate
      # stream for isolation, NOT a fresh `nats:` container per test: per-test
      # containers race RootlessKit's ephemeral-port allocator on the rootless
      # runner (EADDRINUSE → chronic flake). Tree-only grep, runs before any
      # compile. See gordon-bot/tests for the canonical pattern.
      # ─────────────────────────────────────────────────────────────────────
      - name: Gate — no NATS testcontainers (use shared test_nats)
        run: |
          set -eu
          if grep -rnE 'testcontainers_modules::nats|NatsServerCmd' src tests 2>/dev/null; then
            echo "::error::NATS testcontainers detected — use the shared test_nats() broker (gordon-test-db) with a delete+recreate stream for isolation. Per-test nats: containers race the rootless-Docker port allocator (chronic EADDRINUSE flake)."
            exit 1
          fi
          echo "OK: no NATS testcontainers"

      - name: Sanity check persistent cache paths
        run: |
          set -eu
          test -n "$CARGO_HOME" || { echo "::error::CARGO_HOME not set by runner.env"; exit 1; }
          test -n "$CARGO_TARGET_DIR" || { echo "::error::CARGO_TARGET_DIR not set by runner.env"; exit 1; }
          # Self-provision the per-repo target dir: a newly-onboarded repo's
          # cache dir is created on its first CI run rather than failing the
          # build — removes the "inventory edited but runner-role never
          # re-converged" failure class. The runner owns /var/cache/gordon-ci,
          # so it can create the subdir; it persists across runs. The shared
          # CARGO_HOME + its kellnr config.toml remain the runner role's job.
          mkdir -p "$CARGO_TARGET_DIR"
          test -w "$CARGO_HOME" || { echo "::error::CARGO_HOME ($CARGO_HOME) not writable — runner role must provision the shared cargo home"; exit 1; }
          test -w "$CARGO_TARGET_DIR" || { echo "::error::CARGO_TARGET_DIR ($CARGO_TARGET_DIR) not writable after mkdir"; exit 1; }
          test -f "$CARGO_HOME/config.toml" || { echo "::error::Missing $CARGO_HOME/config.toml (kellnr registry config — runner role)"; exit 1; }
          echo "CARGO_HOME=$CARGO_HOME"
          echo "CARGO_TARGET_DIR=$CARGO_TARGET_DIR"

      # Grep-based lints are tree-only — run them before any compile so
      # they fail fast on style regressions.
      - name: Grep-based lints
        run: |
          set -e
          echo "::group::forbid(unsafe_code) check"
          # Three forms accepted (same rustc enforcement):
          #   1. `#![forbid(unsafe_code)]` (legacy file-level).
          #   2. `#![cfg_attr(<cfg>, forbid(unsafe_code))]` (production-only).
          #   3. `[lints.rust] unsafe_code = "forbid"` (manifest, modern).
          if grep -qE '^\s*unsafe_code\s*=\s*"forbid"' Cargo.toml; then
            echo "  manifest-level [lints.rust] unsafe_code = \"forbid\" — ok"
          else
            found=0
            for lib in src/lib.rs src/main.rs crates/*/src/lib.rs crates/*/src/main.rs; do
              [ -f "$lib" ] || continue
              grep -qE '^#!\[(forbid\(unsafe_code\)|cfg_attr\(.*forbid\(unsafe_code\))' "$lib" \
                || { echo "::error file=$lib::Missing #![forbid(unsafe_code)] / #![cfg_attr(<cfg>, forbid(unsafe_code))] / [lints.rust] unsafe_code = \"forbid\""; exit 1; }
              found=1
            done
            [ "$found" = "1" ] || { echo "::error::No crate root found to check for forbid(unsafe_code)"; exit 1; }
          fi
          echo "::endgroup::"

          echo "::group::banned #[allow] at file/module scope"
          ! grep -rnE '^#!\[allow' src/ crates/*/src 2>/dev/null || { echo "::error::Crate-level #![allow] is banned"; exit 1; }
          offending=$(grep -rnE '^#\[allow' src/ crates/*/src 2>/dev/null | grep -v '// allow:' || true)
          [ -z "$offending" ] || { echo "::error::Module-scope #[allow] without '// allow: <reason>' comment"; echo "$offending"; exit 1; }
          echo "::endgroup::"

          echo "::group::no println!/eprintln! (comments + // allow-println: exempt)"
          if grep -rnE '\b(println|eprintln)!' src/ crates/*/src 2>/dev/null | grep -vE '^\S+:\s*[0-9]+:\s*(//|/\*|\s*\*)' | grep -v '// allow-println:'; then
            echo "::error::Use tracing, not println!/eprintln! (mark legitimate uses with // allow-println: <reason>)"
            exit 1
          fi
          echo "::endgroup::"

          echo "::group::TODO format"
          bad=$(grep -rnE 'TODO([^(]|$)' src/ crates/*/src 2>/dev/null | grep -vE '^\S+:\s*[0-9]+:\s*(//|/\*|\s*\*)' || true)
          [ -z "$bad" ] || { echo "::error::TODOs must be formatted TODO(@author, #issue): ..."; echo "$bad"; exit 1; }
          echo "::endgroup::"

          echo "::group::module size"
          find src crates/*/src -name '*.rs' 2>/dev/null | while IFS= read -r f; do
            [ -z "$f" ] && continue
            lines=$(wc -l < "$f")
            if [ "$lines" -gt 1000 ]; then
              echo "::error file=$f::Module exceeds 1000 lines ($lines). Split it."
              exit 1
            fi
          done
          echo "::endgroup::"

      - name: Format
        run: cargo fmt --all -- --check

      # Default features only. Research-only feature flags (e.g. monte-carlo)
      # pull heavy optional deps not provisioned on srv-core ARM64.
      # --all-features would silently violate that constraint.
      - name: Build workspace (debug, all-targets)
        run: cargo build --all-targets --workspace

      - name: Clippy
        run: cargo clippy --all-targets --workspace -- -D warnings -W clippy::pedantic -W clippy::nursery

      - name: cargo-deny
        run: cargo deny check

      # Debug binary — OpenAPI export is pure utoipa codegen, no
      # optimization-sensitive code path. Saves ~5 min vs --release.
      - name: OpenAPI spec drift check
        if: inputs.has_openapi
        run: |
          set -eu
          TMP="${RUNNER_TEMP:-/tmp}/openapi-$$.json"
          cargo run --bin ${{ inputs.binary_name }} -- openapi export "$TMP" 2>/dev/null
          if ! diff -q "$TMP" openapi.json >/dev/null; then
            echo "::error::OpenAPI spec drift detected in openapi.json. Run: cargo run --bin ${{ inputs.binary_name }} -- openapi export openapi.json"
            diff -u openapi.json "$TMP" | head -80 || true
            exit 1
          fi

      # Release binary feeds the docker job via workflow artifact.
      # Dockerfile's `runtime-prebuilt` target COPYs it directly into
      # distroless — no in-image cargo compile.
      - name: Build release binary
        run: |
          cargo build --release --bin ${{ inputs.binary_name }}
          # Copy out of CARGO_TARGET_DIR (which lives outside the workspace)
          # into the workspace so upload-artifact can reach it without an
          # explicit absolute-path mapping.
          mkdir -p artifact
          cp "$CARGO_TARGET_DIR/release/${{ inputs.binary_name }}" artifact/${{ inputs.binary_name }}

      - name: Upload release binary
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.binary_name }}-release-arm64
          path: artifact/${{ inputs.binary_name }}
          retention-days: 1
          if-no-files-found: error

  # Coverage runs in parallel with build-and-gate (no `needs:`). Uses
  # the persistent target-llvm-cov dir provisioned by the runner role —
  # second run after a Cargo.lock-unchanged push compiles incrementally.
  # Serialised against build-and-gate. Both jobs compile the workspace
  # (separate target dirs — instrumented coverage profile isn't
  # target-compatible with the regular one), so running in parallel
  # peaks at ~2× memory and trips the homelab slice cap (12G on
  # srv-core). Sequential keeps a single service CI inside the cap.
  test-coverage:
    needs: build-and-gate
    runs-on: [self-hosted, Linux, ARM64, rootless]
    env:
      PATH: /home/runner-ci/.cargo/bin:/usr/local/bin:/usr/bin:/bin
      RUSTUP_HOME: /home/runner-ci/.rustup
    steps:
      - uses: actions/checkout@v6

      # Per-run Postgres. Integration tests require a live database; they
      # short-circuit via test_postgres_available() without it, which
      # silently drops handlers and reconciler code out of coverage.
      #
      # `docker pull` retried — concurrent CI runs have hit transient
      # containerd ingest-rename races on the self-hosted host
      # (`failed commit on ref ... no such file or directory`).
      - name: Start test Postgres
        id: postgres
        run: |
          NAME="gordon-postgres-test-${{ github.run_id }}-${{ github.run_attempt }}"
          PORT=$((5433 + (${{ github.run_id }} % 1000)))
          # Broader pre-flight cleanup: prior-attempt containers (same run_id,
          # any attempt suffix) AND anything currently publishing the target
          # port. Catches the "rerun attempt N collides with attempt N-1's
          # leaked container on the same stable port" failure mode that
          # blocked the DP-15 cascade 2026-05-17.
          docker ps -aq --filter "name=gordon-postgres-test-${{ github.run_id }}-" | xargs -r docker rm -f >/dev/null 2>&1 || true
          docker ps -aq --filter "publish=$PORT" | xargs -r docker rm -f >/dev/null 2>&1 || true
          sleep 1  # Let the kernel release the port after docker rm.
          pulled=false
          for attempt in 1 2 3 4 5; do
            if docker pull postgres:16-alpine; then
              pulled=true
              break
            fi
            echo "::warning::docker pull postgres:16-alpine attempt $attempt failed — retrying"
            sleep $((attempt * 3))
          done
          $pulled || { echo "::error::Failed to pull postgres:16-alpine after 5 attempts"; exit 1; }
          docker run -d --name "$NAME" \
            -p "$PORT:5432" \
            -e POSTGRES_USER=gordon_test \
            -e POSTGRES_PASSWORD=gordon_test_dev \
            -e POSTGRES_DB=postgres \
            postgres:16-alpine \
            -c fsync=off -c synchronous_commit=off -c full_page_writes=off
          ready=false
          for i in {1..30}; do
            if docker exec "$NAME" pg_isready -U gordon_test -d postgres; then
              ready=true
              break
            fi
            sleep 1
          done
          $ready || { echo "Postgres not ready after 30 attempts"; exit 1; }
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "port=$PORT" >> "$GITHUB_OUTPUT"

      # Per-run JetStream NATS broker. Provisioned only for repos that
      # opt in via `needs_nats` — their integration tests call
      # gordon_test_db::test_nats(), a panic-loud helper that hard-fails
      # if no broker answers at GORDON_TEST_NATS_URL. This mirrors the
      # `nats-test` container in the workspace docker-compose.test.yml
      # (`make test-up`): image `nats:2-alpine`, `-js` (JetStream on —
      # the bus consumers are durable). The tests bootstrap their own
      # `gordon-bus` / `gordon-run-events` streams in-process via
      # get_or_create/update_stream, so no bus-init step is needed here;
      # the broker only has to be reachable with JetStream enabled.
      #
      # `docker pull` retried for the same containerd ingest-rename race
      # the Postgres step guards against.
      - name: Start test NATS broker
        id: nats
        if: inputs.needs_nats
        run: |
          NAME="gordon-nats-test-${{ github.run_id }}-${{ github.run_attempt }}"
          PORT=$((4223 + (${{ github.run_id }} % 1000)))
          # Pre-flight cleanup: prior-attempt containers (same run_id, any
          # attempt suffix) AND anything currently publishing the target
          # port — same leaked-container failure mode the Postgres step
          # guards against on reruns.
          docker ps -aq --filter "name=gordon-nats-test-${{ github.run_id }}-" | xargs -r docker rm -f >/dev/null 2>&1 || true
          docker ps -aq --filter "publish=$PORT" | xargs -r docker rm -f >/dev/null 2>&1 || true
          sleep 1  # Let the kernel release the port after docker rm.
          pulled=false
          for attempt in 1 2 3 4 5; do
            if docker pull nats:2-alpine; then
              pulled=true
              break
            fi
            echo "::warning::docker pull nats:2-alpine attempt $attempt failed — retrying"
            sleep $((attempt * 3))
          done
          $pulled || { echo "::error::Failed to pull nats:2-alpine after 5 attempts"; exit 1; }
          # `-js` enables JetStream; `-m 8222` exposes the monitoring
          # endpoint used for the readiness probe below.
          docker run -d --name "$NAME" \
            -p "$PORT:4222" \
            nats:2-alpine \
            -js -m 8222
          ready=false
          for i in {1..30}; do
            if docker exec "$NAME" wget -qO- http://localhost:8222/healthz >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done
          $ready || { echo "::error::NATS broker not ready after 30 attempts"; docker logs "$NAME" || true; exit 1; }
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "port=$PORT" >> "$GITHUB_OUTPUT"

      # cargo-llvm-cov 0.8.5's --fail-under-lines flag silent-passes
      # regardless of threshold (gate theatre from 2026-04-13 to 2026-04-18).
      # Parse the JSON summary and assert the threshold ourselves — same
      # pattern as .githooks/pre-push, version-robust on the JSON schema.
      #
      # CARGO_TARGET_DIR overridden in the step env to point at the
      # persistent llvm-cov dir provisioned by the runner role. (cargo-
      # llvm-cov has no --target-dir CLI flag; it honours the env var.)
      # Source-only changes after a warm cache rebuild incrementally
      # instead of compiling the whole workspace under the instrumented
      # profile.
      #
      # GORDON_TEST_NATS_URL is set unconditionally — when `needs_nats`
      # is false the `steps.nats.outputs.port` expression is empty, the
      # var resolves to a harmless `nats://localhost:` that no test in a
      # non-NATS repo ever reads (the gordon-test-db `nats` feature, and
      # thus test_nats(), is not compiled for those repos).
      - name: Coverage (drives test compile + run)
        env:
          GORDON_TEST_DATABASE_URL: postgres://gordon_test:gordon_test_dev@localhost:${{ steps.postgres.outputs.port }}/postgres
          GORDON_TEST_NATS_URL: nats://localhost:${{ steps.nats.outputs.port }}
          CARGO_TARGET_DIR: /var/cache/gordon-ci/${{ inputs.binary_name }}/target-llvm-cov
        run: |
          set -eu
          # Self-provision the per-repo llvm-cov dir (same rationale as the
          # build-and-gate cache step — no runner-role re-converge needed).
          mkdir -p "$CARGO_TARGET_DIR"
          COV_JSON=$(cargo llvm-cov --workspace --summary-only --json)
          COV_PCT=$(printf '%s' "$COV_JSON" | jq '.data[0].totals.lines.percent')
          if awk "BEGIN { exit ($COV_PCT >= ${{ inputs.coverage_floor }}) ? 0 : 1 }"; then
            printf 'OK: workspace line coverage %.2f%% >= ${{ inputs.coverage_floor }}%%\n' "$COV_PCT"
          else
            printf 'FAIL: workspace line coverage %.2f%% < ${{ inputs.coverage_floor }}%% required\n' "$COV_PCT" >&2
            printf '%s' "$COV_JSON" | jq -r '.data[0].files[] | [.filename, .summary.lines.percent] | @tsv' \
              | sort -t$'\t' -k2 -n \
              | awk -F'\t' '{ printf "  %5.1f%%  %s\n", $2, $1 }' >&2
            exit 1
          fi

      - name: Stop test Postgres
        if: always()
        run: docker rm -f "${{ steps.postgres.outputs.name }}" || true

      - name: Stop test NATS broker
        if: always() && inputs.needs_nats
        run: docker rm -f "${{ steps.nats.outputs.name }}" || true

  asyncapi-drift:
    if: inputs.has_asyncapi
    runs-on: [self-hosted, Linux, ARM64, rootless]
    steps:
      - uses: actions/checkout@v6
      # NODE_AUTH_TOKEN set via runner env (homelab/roles/github-runner).
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Bundle drift check
        if: hashFiles('asyncapi.yaml') != '' && hashFiles('asyncapi.bundled.yaml') != ''
        run: |
          set -eu
          npm install --prefer-offline --no-audit --no-fund
          TMP="${RUNNER_TEMP:-/tmp}/bundled-$$.yaml"
          npx -y -p @asyncapi/cli@latest asyncapi bundle asyncapi.yaml -o "$TMP" >/dev/null
          if ! diff -q "$TMP" asyncapi.bundled.yaml >/dev/null; then
            echo "::error::asyncapi.bundled.yaml is out of date. Run: npx @asyncapi/cli bundle asyncapi.yaml -o asyncapi.bundled.yaml"
            diff -u asyncapi.bundled.yaml "$TMP" | head -60 || true
            exit 1
          fi

  trivy:
    runs-on: [self-hosted, Linux, ARM64, rootless]
    steps:
      - uses: actions/checkout@v6
      - name: Trivy fs scan
        run: trivy fs --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed .

  release:
    needs: [build-and-gate, test-coverage, asyncapi-drift, trivy]
    # asyncapi-drift is skipped when has_asyncapi=false; `result` is
    # 'skipped' not 'success', so always() is required. The actual gate
    # is the failure of other required jobs.
    if: |
      always() &&
      needs.build-and-gate.result == 'success' &&
      needs.test-coverage.result == 'success' &&
      (needs.asyncapi-drift.result == 'success' || needs.asyncapi-drift.result == 'skipped') &&
      needs.trivy.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push'
    runs-on: [self-hosted, Linux, ARM64, rootless]
    env:
      PATH: /home/runner-ci/.cargo/bin:/usr/local/bin:/usr/bin:/bin
      RUSTUP_HOME: /home/runner-ci/.rustup
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      # cargo-edit pre-installed by Ansible ci-toolchain role; this is a
      # belt-and-braces install for first-run hosts.
      - name: Ensure cargo-edit
        run: command -v cargo-set-version >/dev/null 2>&1 || cargo install cargo-edit --locked

      - name: Run semantic-release
        id: semrel
        uses: cycjimmy/semantic-release-action@v5
        with:
          semantic_version: 24
          extra_plugins: |
            @semantic-release/changelog@6
            @semantic-release/exec@6
            @semantic-release/git@10
            conventional-changelog-conventionalcommits@8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # cycjimmy/semantic-release-action's new_release_* step outputs do
      # not reliably reach this job's `outputs:` block on the self-hosted
      # rootless runners — when empty, the docker job's
      # `if: needs.release.outputs.released == 'true'` silently skips, so a
      # tagged release ships no image (every gordon image froze from
      # 2026-05-15 to 2026-05-20 this way). Derive release state from the
      # authoritative artefact instead: the `vX.Y.Z` tag semantic-release
      # creates on HEAD. cycjimmy's outputs are consulted first; the
      # git-tag check is the fallback, and this step writes the job
      # outputs itself via $GITHUB_OUTPUT — a plain shell append that has
      # no dependency on a third-party action's output propagation.
      - name: Resolve release outputs
        id: relout
        run: |
          set -eu
          published='${{ steps.semrel.outputs.new_release_published }}'
          version='${{ steps.semrel.outputs.new_release_version }}'
          if [ "$published" != 'true' ] || [ -z "$version" ]; then
            tag=$(git tag --points-at HEAD --sort=-v:refname \
                  | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
            if [ -n "$tag" ]; then
              published='true'
              version="${tag#v}"
            else
              published='false'
            fi
          fi
          {
            echo "released=${published}"
            echo "version=${version}"
            [ "$published" = 'true' ] && echo "tag=v${version}" || echo "tag="
          } >> "$GITHUB_OUTPUT"
          echo "release resolved: released=${published} version=${version:-<none>}"

      # ── Image build + push (same job, only when a release was cut) ────
      # Merged into the release job deliberately. A separate `docker` job
      # gated on `needs.release.outputs.released` was skipped by GitHub
      # even when the release job succeeded and set that output: the
      # release job carries `if: always()` (asyncapi-drift is optional and
      # often skipped), and a downstream job without its own
      # status-function `if` does not reliably see an `always()` upstream
      # job's outputs. Every gordon image froze 2026-05-15 → 2026-05-20
      # this way. A same-job `if: steps.relout.outputs.released == 'true'`
      # has no cross-job handoff and cannot hit that failure mode. The
      # working tree is already at the release commit semantic-release
      # created — no re-checkout needed.
      - name: Download release binary
        if: steps.relout.outputs.released == 'true'
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.binary_name }}-release-arm64
          path: ./artifact

      - name: Restore executable bit on release binary
        if: steps.relout.outputs.released == 'true'
        # actions/upload-artifact@v6 does not preserve the Unix executable
        # bit. The binary returns from the upload→download round-trip as
        # 0644; the Dockerfile `runtime-prebuilt` target COPYs it as-is
        # into distroless, and the container then fails at start with
        # `exec: "/usr/local/bin/service": permission denied`. Restore
        # 0755 before the image build COPYs it in.
        run: chmod 0755 "artifact/${{ inputs.binary_name }}"

      - name: Set up Buildx
        if: steps.relout.outputs.released == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: steps.relout.outputs.released == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        if: steps.relout.outputs.released == 'true'
        run: |
          set -eu
          BASE="ghcr.io/${{ github.repository_owner }}/${{ inputs.binary_name }}"
          VERSION="${{ steps.relout.outputs.version }}"
          MAJOR_MINOR=$(echo "$VERSION" | awk -F. '{print $1"."$2}')
          MAJOR=$(echo "$VERSION" | awk -F. '{print $1}')
          echo "tags=${BASE}:${VERSION},${BASE}:${MAJOR_MINOR},${BASE}:${MAJOR},${BASE}:latest" >> "$GITHUB_OUTPUT"

      - name: Build + push arm64 image (prebuilt binary)
        if: steps.relout.outputs.released == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime-prebuilt
          platforms: linux/arm64
          push: true
          load: true
          # Force a fresh pull of the distroless base on every build. The
          # `gcr.io/distroless/cc-debian12:nonroot` tag is moving — Google
          # rolls Debian security updates (e.g. CVE-2026-0861 libc6
          # 2.36-9+deb12u14) into the same tag. Without `pull: true`, the
          # runner reuses a stale cached base layer and Trivy fails on
          # vulnerabilities already patched upstream.
          pull: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VERSION=${{ steps.relout.outputs.version }}
            PREBUILT_BINARY=artifact/${{ inputs.binary_name }}
            SERVICE_PORT=${{ inputs.service_port }}
          provenance: true
          sbom: true

      - name: Trivy image scan
        if: steps.relout.outputs.released == 'true'
        # Caller repos can pin upstream-unpatched CVEs in `.trivyignore` at
        # the repo root (one CVE per line, optional inline rationale).
        # Trivy auto-discovers the file when --ignorefile points at it.
        # Mount the workspace into /work so the file is reachable from
        # inside the trivy container, and set --ignorefile explicitly so
        # the resolution is deterministic.
        run: |
          IGNOREFILE_ARG=""
          if [ -f .trivyignore ]; then
            echo "Trivy: applying .trivyignore from $(pwd)"
            cat .trivyignore | sed 's/^/  /'
            IGNOREFILE_ARG="--ignorefile /work/.trivyignore"
          fi
          # Re-map the runner's docker socket to the canonical path Trivy
          # expects. Under rootless dockerd $DOCKER_HOST points at
          # unix:///run/user/<uid>/docker.sock (per-UID socket); under
          # legacy system dockerd it is unset and we fall back to
          # /var/run/docker.sock. Either way, mounting it inside the
          # container as /var/run/docker.sock keeps Trivy and the daemon
          # agnostic of the host topology.
          DOCKER_SOCK="${DOCKER_HOST#unix://}"
          DOCKER_SOCK="${DOCKER_SOCK:-/var/run/docker.sock}"
          # Trivy's vuln-DB cache uses a docker NAMED VOLUME, not a host
          # bind mount. Under rootless dockerd a host bind mount of
          # /tmp/trivy-cache is owned by the runner user, but the trivy
          # container writes as its own (subuid-mapped) root → EACCES on
          # /root/.cache/trivy/db/trivy.db. A named volume is daemon-
          # managed and writable by the container, and still persists the
          # ~93 MB DB across runs on the same runner.
          docker run --rm \
            -v trivy-db-cache:/root/.cache/trivy \
            -v "${DOCKER_SOCK}:/var/run/docker.sock" \
            -v "$(pwd):/work" \
            -w /work \
            aquasec/trivy:0.69.3 \
            image --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed $IGNOREFILE_ARG \
            ghcr.io/${{ github.repository_owner }}/${{ inputs.binary_name }}:${{ steps.relout.outputs.version }}

      - name: Trigger blue/green deploy via homelab-webhook
        # Idempotent POST — retries are safe (same image tag, same result).
        # Transient TLS/DNS failures during heavy CI load on Pi5 runners
        # are common; 3 attempts with 5s backoff covers the typical burst.
        #
        # Key/URL resolution: prefers workflow secrets (caller-supplied);
        # falls back to runner process env vars (set by homelab Ansible
        # role). This lets callers omit secrets: passthrough when the
        # runner already carries the credentials.
        if: inputs.deploy_webhook && steps.relout.outputs.released == 'true'
        env:
          SECRET_DEPLOY_KEY: ${{ secrets.WEBHOOK_DEPLOY_KEY }}
          SECRET_WEBHOOK_URL: ${{ secrets.HOMELAB_WEBHOOK_URL }}
        run: |
          set -eu

          # Resolve deploy key: secret > runner env
          DEPLOY_KEY="${SECRET_DEPLOY_KEY:-${WEBHOOK_DEPLOY_KEY:-}}"
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::error::WEBHOOK_DEPLOY_KEY not available via secrets or runner environment"
            exit 1
          fi
          echo "::add-mask::$DEPLOY_KEY"

          # Resolve webhook URL: secret > runner env
          DEPLOY_URL="${SECRET_WEBHOOK_URL:-${HOMELAB_WEBHOOK_URL:-}}"
          if [ -z "$DEPLOY_URL" ]; then
            echo "::error::HOMELAB_WEBHOOK_URL not available via secrets or runner environment"
            exit 1
          fi

          for attempt in 1 2 3; do
            # --max-time sits just above the nginx proxy_read_timeout (360s)
            # so a genuine slow rollout surfaces as a diagnosable 504, not a
            # transport-level 000. Sync handler returns 200 on real success.
            HTTP_CODE=$(curl --silent --show-error --output /dev/stderr \
              --write-out "%{http_code}" \
              --max-time 380 \
              -X POST "${DEPLOY_URL}/deploy" \
              -H "Authorization: Bearer ${DEPLOY_KEY}" \
              -H "Content-Type: application/json" \
              -d "{\"target_image_tag\": \"${{ steps.relout.outputs.version }}\"}" ) || true
            if [ "$HTTP_CODE" = "202" ] || [ "$HTTP_CODE" = "200" ]; then
              echo "Deploy webhook accepted (HTTP $HTTP_CODE) on attempt $attempt"
              exit 0
            fi
            echo "Attempt $attempt: HTTP $HTTP_CODE (expected 202; 000 = transport error)"
            [ "$attempt" -lt 3 ] && sleep 5
          done
          echo "::error::Webhook deploy failed after 3 attempts — last HTTP $HTTP_CODE"
          exit 1
