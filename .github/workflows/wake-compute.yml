name: Wake srv-compute

# Reusable workflow to wake srv-compute via WoL before X64 runner jobs.
# Runs on ANY always-on ARM64 host — the broker places it, this does not pin srv-core —
# calls the WoL HTTP relay on srv-compute-wol, then polls until srv-compute is reachable.
#
# No secrets needed: the token is at /opt/runner-rootless/.wol-token, written by the
# runner-rootless role when runner_rootless_wol_token_enabled is true.
#
# That claim was FALSE from 2026-05-20 to 2026-08-13. The variable it named died with the
# legacy github-runner role and nothing re-created the file, which survived on srv-core
# alone as a leftover. Since this job selects [self-hosted, rootless, ARM64] and the broker
# places it on any of three hosts, two placements out of three would have failed on
# `cat: No such file`. It went unnoticed because the sole caller kept landing on srv-core.
# The role now provisions it on every always-on ARM64 host; keep it that way.
#
# Note github-triage ALSO auto-wakes srv-compute (TRIAGE_X64_HOSTS + TRIAGE_WOL_*), which
# is why the-beret-game's X64 legs work with no wake job. This workflow is the explicit,
# bounded, fail-loud variant for pipelines that must not start building before the box
# answers.

on:
  workflow_call:

jobs:
  wake:
    runs-on: [self-hosted, rootless, ARM64]
    timeout-minutes: 5
    steps:
      - name: Send wake packet
        run: |
          # wol-http moved to srv-apps :9099 on 2026-08-23 (the .41 Pi relay
          # is retired — the i9's eno2 WoL NIC is LAN-cabled now).
          token=$(cat /opt/runner-rootless/.wol-token)
          response=$(curl -sf --connect-timeout 5 --max-time 10 \
            -X POST http://192.168.1.30:9099/wake \
            -H "Authorization: Bearer ${token}")
          echo "wol-http response: ${response}"

      - name: Wait for srv-compute to come online
        run: |
          echo "Waiting for srv-compute (192.168.1.40) ..."
          for i in $(seq 1 30); do
            if curl -sf --connect-timeout 3 --max-time 5 http://192.168.1.40:9100/metrics > /dev/null 2>&1; then
              echo "srv-compute is online after ~$((i * 10))s"
              exit 0
            fi
            sleep 10
          done
          echo "::error::srv-compute did not come online within 300s"
          exit 1
