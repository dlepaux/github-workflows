name: Rust Crate CI

# CI shape for Gordon kellnr-published library crates (post 2026-05-15
# ci-perf-overhaul):
#
# - Self-hosted runner on srv-core (Pi5, ARM64). Persistent
#   /var/cache/gordon-ci/<crate>/target/ + shared /var/cache/gordon-ci/cargo/
#   are owned by the homelab role (homelab/roles/github-runner). No
#   actions/cache calls — local SSD is the cache. CARGO_HOME +
#   CARGO_TARGET_DIR come from runner.env.
# - build-and-gate: grep lints, fmt, build, clippy, deny. One job, warm
#   target/ in-process.
# - test-coverage: separate job (instrumented profile is target-
#   incompatible). Uses its own persistent target-llvm-cov/. Runs in
#   parallel with build-and-gate.
# - trivy: filesystem scan, runs in parallel.
# - release: semantic-release on push to main; gates publish.
# - publish: handled inside the release job via @semantic-release/exec's
#            publishCmd; no separate job. No Docker, no deploy.
#
# No Postgres — library crates must not carry integration tests that
# depend on a live database. If a test genuinely requires it, it belongs
# in the calling service's test suite.
#
# Caller pins at a tag: uses: dlepaux/github-workflows/.github/workflows/rust-crate.yml@v1.0.0

on:
  workflow_call:
    inputs:
      crate_name:
        description: Crate name as it appears in Cargo.toml (e.g. gordon-protocol)
        type: string
        required: true
      publish_to_kellnr:
        description: >
          DEPRECATED — no-op since v1.2.2. Publication is now driven by
          `@semantic-release/exec`'s `publishCmd` inside the release
          job. Kept as an input for caller-compat; remove the field
          from caller workflows at next chore.
        type: boolean
        default: true
      needs_postgres:
        description: >
          Spin up a per-run Postgres container during test-coverage and
          export GORDON_TEST_DATABASE_URL. Required for crates whose
          tests integrate against a live DB (gordon-platform's ipc
          pg-NOTIFY pubsub, gordon-bus's e2e_nats_integration, gordon-
          test-db's test_db() fixtures).
        type: boolean
        default: false
      needs_nats:
        description: >
          Spin up a per-run NATS JetStream container during test-coverage
          and export GORDON_TEST_NATS_URL. Required for gordon-bus's
          e2e_nats_integration tests against a real broker.
        type: boolean
        default: false
      coverage_floor:
        description: >
          Minimum workspace line coverage percent. Default 70. Lower
          temporarily where an integration suite is structurally unable
          to run in CI (e.g. gordon-bus's e2e_nats_integration on the
          small alpine broker — tracked as backlog).
        type: number
        default: 70
      is_cli_tool:
        description: >
          Skip the println!/eprintln! lint gate. CLI tools legitimately
          use stdout/stderr as their interface — the tracing-only rule
          applies to library crates and services, not user-facing binaries.
        type: boolean
        default: false
    secrets:
      # kellnr token (read to fetch deps; publish for `cargo publish --registry
      # gordon`). Optional during the runner-env→repo-secret migration: when a
      # caller does not forward it, jobs fall back to the runner role's ambient
      # env. See gordon-workspace plan/active/ci-deploy-key-drift.md.
      KELLNR_TOKEN:
        required: false
    # NOTE: dropped runner_host input in v1.x — mixing literal + ${{ }}
    # expression in `runs-on: [...]` fails workflow_call validation
    # (startup_failure). All jobs run on [self-hosted, Linux, ARM64,
    # homelab] which floats across both srv-core and srv-apps.

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

# Serialise per-ref. Different refs run in parallel; within a single ref,
# queue rather than overlap — concurrent builds contend on cargo's advisory
# locks on the persistent target/.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Compile + lint that share warm target/. Persistent CARGO_TARGET_DIR
  # (runner.env) keeps incremental compile state across runs.
  build-and-gate:
    runs-on: [self-hosted, Linux, ARM64, rootless]
    env:
      PATH: /home/runner-ci/.cargo/bin:/usr/local/bin:/usr/bin:/bin
      RUSTUP_HOME: /home/runner-ci/.rustup
      # CARGO_HOME + CARGO_TARGET_DIR inherited from runner.env (homelab role).
    steps:
      - uses: actions/checkout@v6

      # ─────────────────────────────────────────────────────────────────────
      # Gate — no per-test NATS testcontainers. Integration tests must use the
      # shared test_nats() broker (gordon-test-db) with a delete+recreate
      # stream for isolation, NOT a fresh `nats:` container per test: per-test
      # containers race RootlessKit's ephemeral-port allocator on the rootless
      # runner (EADDRINUSE → chronic flake). Tree-only grep, runs before any
      # compile. See gordon-bot/tests for the canonical pattern.
      # ─────────────────────────────────────────────────────────────────────
      - name: Gate — no NATS testcontainers (use shared test_nats)
        run: |
          set -eu
          if grep -rnE 'testcontainers_modules::nats|NatsServerCmd' src tests 2>/dev/null; then
            echo "::error::NATS testcontainers detected — use the shared test_nats() broker (gordon-test-db) with a delete+recreate stream for isolation. Per-test nats: containers race the rootless-Docker port allocator (chronic EADDRINUSE flake)."
            exit 1
          fi
          echo "OK: no NATS testcontainers"

      - name: Self-provision + sanity-check persistent cache paths
        run: |
          set -eu
          test -n "$CARGO_HOME" || { echo "::error::CARGO_HOME not set by runner.env"; exit 1; }
          test -n "$CARGO_TARGET_DIR" || { echo "::error::CARGO_TARGET_DIR not set by runner.env"; exit 1; }
          # Self-provision the per-repo target dir: a newly-onboarded repo's
          # cache dir is created on its first CI run rather than failing the
          # build. This removes the "inventory edited but runner-role never
          # re-converged" failure class (the runner owns /var/cache/gordon-ci,
          # so it can create the subdir; it then persists across runs). The
          # shared CARGO_HOME + its kellnr config.toml remain the runner
          # role's job — those are checked, not created, below.
          mkdir -p "$CARGO_TARGET_DIR"
          test -w "$CARGO_HOME" || { echo "::error::CARGO_HOME ($CARGO_HOME) not writable — runner role must provision the shared cargo home"; exit 1; }
          test -w "$CARGO_TARGET_DIR" || { echo "::error::CARGO_TARGET_DIR ($CARGO_TARGET_DIR) not writable after mkdir"; exit 1; }
          test -f "$CARGO_HOME/config.toml" || { echo "::error::Missing $CARGO_HOME/config.toml (kellnr registry config — runner role)"; exit 1; }
          echo "CARGO_HOME=$CARGO_HOME"
          echo "CARGO_TARGET_DIR=$CARGO_TARGET_DIR"

      # Kellnr token: repo secret → env (else runner ambient). Belt+suspenders
      # during the runner-env→repo-secret migration: only written when non-empty
      # so an unforwarded secret falls back to the runner role's ambient token.
      - name: Source kellnr token from repo secret
        env:
          KELLNR_TOKEN_SECRET: ${{ secrets.KELLNR_TOKEN }}
        run: |
          set -eu
          if [ -n "${KELLNR_TOKEN_SECRET:-}" ]; then
            echo "::add-mask::$KELLNR_TOKEN_SECRET"
            {
              echo "CARGO_REGISTRIES_GORDON_TOKEN=$KELLNR_TOKEN_SECRET"
              echo "KELLNR_TOKEN=$KELLNR_TOKEN_SECRET"
            } >> "$GITHUB_ENV"
            echo "kellnr token: sourced from repo secret"
          else
            echo "kellnr token: repo secret not forwarded — using runner ambient env"
          fi

      # Grep-based lints are tree-only — run them before any compile so
      # they fail fast on style regressions.
      - name: Grep-based lints
        run: |
          set -e
          echo "::group::forbid(unsafe_code) check"
          # Three forms accepted — all enforce the same rustc lint:
          #   1. File-level     `#![forbid(unsafe_code)]` in src/lib.rs (legacy).
          #   2. Conditional    `#![cfg_attr(<cfg>, forbid(unsafe_code))]` in
          #                     src/lib.rs (e.g. `not(test)` — production-only,
          #                     used by gordon-exchange so test helpers can carry
          #                     narrowly-scoped unsafe).
          #   3. Manifest       `[lints.rust] unsafe_code = "forbid"` in
          #                     Cargo.toml (modern idiom; workspace convention
          #                     since the 2026-05-15 split crates).
          if grep -qE '^\s*unsafe_code\s*=\s*"forbid"' Cargo.toml; then
            echo "  manifest-level [lints.rust] unsafe_code = \"forbid\" — ok"
          else
            found=0
            for lib in src/lib.rs src/main.rs crates/*/src/lib.rs crates/*/src/main.rs; do
              [ -f "$lib" ] || continue
              grep -qE '^#!\[(forbid\(unsafe_code\)|cfg_attr\(.*forbid\(unsafe_code\))' "$lib" \
                || { echo "::error file=$lib::Missing #![forbid(unsafe_code)] / #![cfg_attr(<cfg>, forbid(unsafe_code))] / [lints.rust] unsafe_code = \"forbid\""; exit 1; }
              found=1
            done
            [ "$found" = "1" ] || { echo "::error::No crate root found to check for forbid(unsafe_code)"; exit 1; }
          fi
          echo "::endgroup::"

          echo "::group::banned #[allow] at file/module scope"
          ! grep -rnE '^#!\[allow' src/ crates/*/src 2>/dev/null || { echo "::error::Crate-level #![allow] is banned"; exit 1; }
          offending=$(grep -rnE '^#\[allow' src/ crates/*/src 2>/dev/null | grep -v '// allow:' || true)
          [ -z "$offending" ] || { echo "::error::Module-scope #[allow] without '// allow: <reason>' comment"; echo "$offending"; exit 1; }
          echo "::endgroup::"

          echo "::group::no println!/eprintln! (comments + // allow-println: exempt)"
          if [ "${{ inputs.is_cli_tool }}" = "true" ]; then
            echo "  is_cli_tool=true — println!/eprintln! lint skipped (CLI tools use stdout/stderr)"
          else
            if grep -rnE '\b(println|eprintln)!' src/ crates/*/src 2>/dev/null | grep -vE '^\S+:\s*[0-9]+:\s*(//|/\*|\s*\*)' | grep -v '// allow-println:'; then
              echo "::error::Use tracing, not println!/eprintln! (mark legitimate uses with // allow-println: <reason>)"
              exit 1
            fi
          fi
          echo "::endgroup::"

          echo "::group::TODO format"
          bad=$(grep -rnE 'TODO([^(]|$)' src/ crates/*/src 2>/dev/null | grep -vE '^\S+:\s*[0-9]+:\s*(//|/\*|\s*\*)' || true)
          [ -z "$bad" ] || { echo "::error::TODOs must be formatted TODO(@author, #issue): ..."; echo "$bad"; exit 1; }
          echo "::endgroup::"

          echo "::group::module size"
          find src crates/*/src -name '*.rs' 2>/dev/null | while IFS= read -r f; do
            [ -z "$f" ] && continue
            lines=$(wc -l < "$f")
            if [ "$lines" -gt 1000 ]; then
              echo "::error file=$f::Module exceeds 1000 lines ($lines). Split it."
              exit 1
            fi
          done
          echo "::endgroup::"

      - name: Format
        run: cargo fmt --all -- --check

      # Default features only — same rationale as rust-service: optional
      # feature flags can pull heavy deps not provisioned on srv-core ARM64.
      - name: Build workspace (debug, all-targets)
        run: cargo build --all-targets --all-features --workspace

      - name: Clippy
        run: cargo clippy --all-targets --all-features --workspace -- -D warnings -W clippy::pedantic -W clippy::nursery

      - name: cargo-deny
        run: cargo deny check

  # Serialised against build-and-gate. Both jobs compile the workspace
  # (separate target dirs — instrumented coverage profile isn't
  # target-compatible with the regular one), so parallel execution
  # peaks at ~2× memory and trips the homelab slice cap (12G on
  # srv-core). Sequential keeps a single crate CI inside the cap.
  test-coverage:
    needs: build-and-gate
    runs-on: [self-hosted, Linux, ARM64, rootless]
    env:
      PATH: /home/runner-ci/.cargo/bin:/usr/local/bin:/usr/bin:/bin
      RUSTUP_HOME: /home/runner-ci/.rustup
    steps:
      - uses: actions/checkout@v6

      # Kellnr token: repo secret → env (else runner ambient). See build-and-gate.
      - name: Source kellnr token from repo secret
        env:
          KELLNR_TOKEN_SECRET: ${{ secrets.KELLNR_TOKEN }}
        run: |
          set -eu
          if [ -n "${KELLNR_TOKEN_SECRET:-}" ]; then
            echo "::add-mask::$KELLNR_TOKEN_SECRET"
            {
              echo "CARGO_REGISTRIES_GORDON_TOKEN=$KELLNR_TOKEN_SECRET"
              echo "KELLNR_TOKEN=$KELLNR_TOKEN_SECRET"
            } >> "$GITHUB_ENV"
            echo "kellnr token: sourced from repo secret"
          else
            echo "kellnr token: repo secret not forwarded — using runner ambient env"
          fi

      # Per-run Postgres for crates whose tests integrate against a live
      # DB. Gated on `needs_postgres` input. Same shape as rust-service.yml.
      #
      # `docker pull` retried — see NATS sidecar comment for rationale.
      - name: Start test Postgres
        id: postgres
        if: inputs.needs_postgres
        run: |
          NAME="gordon-postgres-test-${{ github.run_id }}-${{ github.run_attempt }}"
          PORT=$((5433 + (${{ github.run_id }} % 1000)))
          # Broader pre-flight cleanup: prior-attempt containers (same run_id,
          # any attempt suffix) AND anything currently publishing the target
          # port. Catches the "rerun attempt N collides with attempt N-1's
          # leaked container on the same stable port" failure mode that
          # blocked the DP-15 cascade 2026-05-17.
          docker ps -aq --filter "name=gordon-postgres-test-${{ github.run_id }}-" | xargs -r docker rm -f >/dev/null 2>&1 || true
          docker ps -aq --filter "publish=$PORT" | xargs -r docker rm -f >/dev/null 2>&1 || true
          sleep 1  # Let the kernel release the port after docker rm.
          pulled=false
          for attempt in 1 2 3 4 5; do
            if docker pull postgres:16-alpine; then
              pulled=true
              break
            fi
            echo "::warning::docker pull postgres:16-alpine attempt $attempt failed — retrying"
            sleep $((attempt * 3))
          done
          $pulled || { echo "::error::Failed to pull postgres:16-alpine after 5 attempts"; exit 1; }
          docker run -d --name "$NAME" \
            -p "$PORT:5432" \
            -e POSTGRES_USER=gordon_test \
            -e POSTGRES_PASSWORD=gordon_test_dev \
            -e POSTGRES_DB=postgres \
            postgres:16-alpine \
            -c fsync=off -c synchronous_commit=off -c full_page_writes=off
          ready=false
          for i in {1..30}; do
            if docker exec "$NAME" pg_isready -U gordon_test -d postgres; then
              ready=true
              break
            fi
            sleep 1
          done
          $ready || { echo "Postgres not ready after 30 attempts"; exit 1; }
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "port=$PORT" >> "$GITHUB_OUTPUT"

      # Per-run NATS JetStream broker. Same shape as the Postgres sidecar.
      # Default NATS port 4222 inside the container; bind to a per-run host
      # port to avoid collisions; tests connect via $GORDON_TEST_NATS_URL.
      #
      # `docker pull` retried — concurrent pulls have hit transient
      # containerd ingest-rename races on the self-hosted host
      # (`failed commit on ref ... no such file or directory`).
      - name: Start test NATS
        id: nats
        if: inputs.needs_nats
        run: |
          NAME="gordon-nats-test-${{ github.run_id }}-${{ github.run_attempt }}"
          PORT=$((4223 + (${{ github.run_id }} % 1000)))
          # Broader pre-flight cleanup: prior-attempt containers (same run_id,
          # any attempt suffix) AND anything currently publishing the target
          # port. Catches the "rerun attempt N collides with attempt N-1's
          # leaked container on the same stable port" failure mode that
          # blocked the DP-15 cascade 2026-05-17.
          docker ps -aq --filter "name=gordon-nats-test-${{ github.run_id }}-" | xargs -r docker rm -f >/dev/null 2>&1 || true
          docker ps -aq --filter "publish=$PORT" | xargs -r docker rm -f >/dev/null 2>&1 || true
          sleep 1  # Let the kernel release the port after docker rm.
          pulled=false
          for attempt in 1 2 3 4 5; do
            if docker pull nats:2-alpine; then
              pulled=true
              break
            fi
            echo "::warning::docker pull nats:2-alpine attempt $attempt failed — retrying"
            sleep $((attempt * 3))
          done
          $pulled || { echo "::error::Failed to pull nats:2-alpine after 5 attempts"; exit 1; }
          docker run -d --name "$NAME" \
            -p "$PORT:4222" \
            nats:2-alpine \
            --jetstream --store_dir=/tmp/nats
          # Readiness probes:
          # 1. docker logs grep for the NATS-emitted "Server is ready" line —
          #    the only probe that survives both (a) nats:2-alpine lacking
          #    wget/curl and (b) the srv-core runner host lacking nc. The
          #    other two probes stay as fallbacks for environments where they
          #    work.
          # 2. docker exec /bin/sh -c "cat < /dev/tcp/127.0.0.1/4222" — bash
          #    TCP builtin, no external binary needed inside the container.
          # 3. nc -z on the host — kept for runners with nc installed.
          ready=false
          for i in {1..30}; do
            if docker logs "$NAME" 2>&1 | grep -q 'Server is ready' \
              || docker exec "$NAME" sh -c 'exec 3<>/dev/tcp/127.0.0.1/4222' 2>/dev/null \
              || nc -z 127.0.0.1 "$PORT" 2>/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          $ready || { echo "NATS not ready after 30 attempts"; docker logs "$NAME" || true; exit 1; }
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "port=$PORT" >> "$GITHUB_OUTPUT"

      # cargo-llvm-cov 0.8.5's --fail-under-lines flag silent-passes
      # regardless of threshold. Parse JSON and assert ourselves — same
      # pattern as .githooks/pre-push, version-robust on the JSON schema.
      #
      # CARGO_TARGET_DIR overridden to the persistent llvm-cov dir
      # provisioned by the runner role. cargo-llvm-cov honours the env var
      # (no --target-dir CLI flag).
      - name: Coverage (drives test compile + run)
        env:
          CARGO_TARGET_DIR: /var/cache/gordon-ci/${{ inputs.crate_name }}/target-llvm-cov
          GORDON_TEST_DATABASE_URL: ${{ inputs.needs_postgres && format('postgres://gordon_test:gordon_test_dev@localhost:{0}/postgres', steps.postgres.outputs.port) || '' }}
          GORDON_TEST_NATS_URL: ${{ inputs.needs_nats && format('nats://localhost:{0}', steps.nats.outputs.port) || '' }}
        run: |
          set -eu
          # Self-provision the per-repo llvm-cov dir (same rationale as the
          # build-and-gate cache step — no runner-role re-converge needed for
          # a newly-onboarded repo).
          mkdir -p "$CARGO_TARGET_DIR"
          COV_JSON=$(cargo llvm-cov --all-features --workspace --summary-only --json)
          COV_PCT=$(printf '%s' "$COV_JSON" | jq '.data[0].totals.lines.percent')
          COV_FLOOR=${{ inputs.coverage_floor }}
          if awk "BEGIN { exit ($COV_PCT >= $COV_FLOOR) ? 0 : 1 }"; then
            printf 'OK: workspace line coverage %.2f%% >= %d%%\n' "$COV_PCT" "$COV_FLOOR"
          else
            printf 'FAIL: workspace line coverage %.2f%% < %d%% required\n' "$COV_PCT" "$COV_FLOOR" >&2
            printf '%s' "$COV_JSON" | jq -r '.data[0].files[] | [.filename, .summary.lines.percent] | @tsv' \
              | sort -t$'\t' -k2 -n \
              | awk -F'\t' '{ printf "  %5.1f%%  %s\n", $2, $1 }' >&2
            exit 1
          fi

      - name: Stop test Postgres
        if: always() && inputs.needs_postgres
        run: docker rm -f "${{ steps.postgres.outputs.name }}" || true

      - name: Stop test NATS
        if: always() && inputs.needs_nats
        run: docker rm -f "${{ steps.nats.outputs.name }}" || true

  trivy:
    runs-on: [self-hosted, Linux, ARM64, rootless]
    steps:
      - uses: actions/checkout@v6
      - name: Trivy fs scan
        run: trivy fs --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed .

  release:
    needs: [build-and-gate, test-coverage, trivy]
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push'
    runs-on: [self-hosted, Linux, ARM64, rootless]
    env:
      PATH: /home/runner-ci/.cargo/bin:/usr/local/bin:/usr/bin:/bin
      RUSTUP_HOME: /home/runner-ci/.rustup
    permissions:
      contents: write
      packages: write
    outputs:
      released: ${{ steps.semrel.outputs.new_release_published }}
      version: ${{ steps.semrel.outputs.new_release_version }}
      tag: ${{ steps.semrel.outputs.new_release_git_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      # cargo-edit pre-installed by Ansible ci-toolchain role; this is a
      # belt-and-braces install for first-run hosts.
      - name: Ensure cargo-edit
        run: command -v cargo-set-version >/dev/null 2>&1 || cargo install cargo-edit --locked

      # Kellnr token for `cargo publish --registry gordon --token "$KELLNR_TOKEN"`
      # (semantic-release publishCmd). Repo secret → env, else runner ambient.
      # Only written when non-empty so an unforwarded secret keeps the ambient
      # publish token (empty would override it and 401 the publish).
      - name: Source kellnr token from repo secret
        env:
          KELLNR_TOKEN_SECRET: ${{ secrets.KELLNR_TOKEN }}
        run: |
          set -eu
          if [ -n "${KELLNR_TOKEN_SECRET:-}" ]; then
            echo "::add-mask::$KELLNR_TOKEN_SECRET"
            {
              echo "CARGO_REGISTRIES_GORDON_TOKEN=$KELLNR_TOKEN_SECRET"
              echo "KELLNR_TOKEN=$KELLNR_TOKEN_SECRET"
            } >> "$GITHUB_ENV"
            echo "kellnr token: sourced from repo secret"
          else
            echo "kellnr token: repo secret not forwarded — using runner ambient env"
          fi

      - name: Run semantic-release
        id: semrel
        uses: cycjimmy/semantic-release-action@v5
        with:
          semantic_version: 24
          extra_plugins: |
            @semantic-release/changelog@6
            @semantic-release/exec@6
            @semantic-release/git@10
            conventional-changelog-conventionalcommits@8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publication is handled by `@semantic-release/exec` inside the
  # release job — its `publishCmd` runs `cargo publish --registry gordon
  # --token "$KELLNR_TOKEN" --allow-dirty` as part of the same release
  # transaction (no separate job needed). A duplicate publish job here
  # fails with `crate already exists` on the second pass.
